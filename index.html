<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Phone Manager - Discord Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .grid-bg { background-image: radial-gradient(#21262d 1px, transparent 1px); background-size: 16px 16px; }
    </style>
</head>
<body class="grid-bg min-h-screen p-4">

    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-800 pb-3 mb-6">
        <div class="flex items-center gap-2">
            <span class="font-bold text-xl text-blue-400">Cloud Manager</span>
            <span id="ws-status" class="text-xs bg-red-900 text-red-300 px-2 py-0.5 rounded-full">Discord: Disconnected</span>
        </div>
        <div class="text-sm text-gray-400">Máy hiện có: <b id="device-count" class="text-white">0</b></div>
    </div>

    <!-- Dashboard Grid -->
    <div id="device-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Nút Nhận Máy Free -->
        <div onclick="openModal()" class="border-2 border-dashed border-gray-700 hover:border-blue-500 cursor-pointer rounded-xl h-64 flex flex-col items-center justify-center transition group">
            <div class="w-12 h-12 rounded-full bg-gray-800 group-hover:bg-blue-600 flex items-center justify-center text-2xl mb-2 transition">+</div>
            <span class="text-sm font-medium text-gray-400 group-hover:text-white">Nhận Máy Free</span>
        </div>
    </div>

    <!-- Modal Chọn Provider -->
    <div id="modal-select" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-white">Nhận Máy Free</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <p class="text-xs text-gray-400 mb-3">Cloudphone: (Chọn 1)</p>
            <div class="grid grid-cols-2 gap-2 mb-6">
                <button id="btn-vmos" onclick="selectProvider('vmos')" class="p-3 border border-blue-500 bg-blue-950/30 text-blue-400 rounded-lg text-sm font-medium">VMOS</button>
                <button id="btn-vsphone" onclick="selectProvider('vsphone')" class="p-3 border border-gray-700 hover:border-gray-500 rounded-lg text-sm font-medium">VSPhone</button>
            </div>
            <button onclick="startProcess()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition">Lấy máy</button>
        </div>
    </div>

    <!-- Modal Embedding Iframe Auto Reg -->
    <div id="modal-iframe" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-2 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-md h-[90vh] flex flex-col overflow-hidden">
            <!-- Header Thông Báo Trạng Thái -->
            <div class="bg-gray-800 px-4 py-2 flex flex-col border-b border-gray-700 gap-1">
                <div class="flex justify-between items-center">
                    <span id="log-status" class="text-xs font-mono text-yellow-400">Đang chờ lấy Mail từ Discord...</span>
                    <button onclick="closeIframeModal()" class="text-gray-400 hover:text-white">&times;</button>
                </div>
                <div id="email-display" class="text-xs font-mono text-gray-300 bg-gray-900 p-1.5 rounded hidden">
                    Email: <span id="current-email" class="text-blue-400"></span>
                </div>
            </div>
            <!-- Iframe Web Đăng Ký -->
            <iframe id="cloud-iframe" class="w-full flex-1 bg-white" src=""></iframe>
        </div>
    </div>

    <script>
        let selectedCloud = 'vmos';
        let socket = null;
        let currentEmail = '';

        // Kết nối WebSocket Server
        function initWebSocket() {
            socket = new WebSocket("wss://rikaa.wisp.uno/ws");

            socket.onopen = () => {
                const statusEl = document.getElementById('ws-status');
                statusEl.innerText = "Discord: Connected";
                statusEl.className = "text-xs bg-green-900 text-green-300 px-2 py-0.5 rounded-full";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                // Nhận Email từ Bot Discord
                if (data.action === "MAIL_CREATED") {
                    currentEmail = data.email;
                    document.getElementById('current-email').innerText = currentEmail;
                    document.getElementById('email-display').classList.remove('hidden');
                    document.getElementById('log-status').innerText = "Đã nhận Email! Hãy trượt Captcha để nhận mã.";
                    
                    // Gửi Email vào Iframe
                    postToIframe({ action: "FILL_FORM", email: currentEmail, password: data.password || "AutoPass123!" });
                }

                // Nhận OTP từ Bot Discord
                if (data.action === "OTP_RECEIVED") {
                    document.getElementById('log-status').innerText = "Đã nhận OTP: " + data.otp + ". Đang tự động đăng ký...";
                    postToIframe({ action: "SUBMIT_OTP", otp: data.otp });
                }
            };

            socket.onclose = () => {
                const statusEl = document.getElementById('ws-status');
                statusEl.innerText = "Discord: Disconnected";
                statusEl.className = "text-xs bg-red-900 text-red-300 px-2 py-0.5 rounded-full";
                setTimeout(initWebSocket, 3000);
            };
        }

        initWebSocket();

        function openModal() { document.getElementById('modal-select').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-select').classList.add('hidden'); }
        
        function selectProvider(type) {
            selectedCloud = type;
            document.getElementById('btn-vmos').className = type === 'vmos' ? 'p-3 border border-blue-500 bg-blue-950/30 text-blue-400 rounded-lg text-sm font-medium' : 'p-3 border border-gray-700 rounded-lg text-sm font-medium';
            document.getElementById('btn-vsphone').className = type === 'vsphone' ? 'p-3 border border-blue-500 bg-blue-950/30 text-blue-400 rounded-lg text-sm font-medium' : 'p-3 border border-gray-700 rounded-lg text-sm font-medium';
        }

        function startProcess() {
            closeModal();
            document.getElementById('modal-iframe').classList.remove('hidden');
            document.getElementById('log-status').innerText = "Đang gửi yêu cầu tạo Mail tới Discord...";
            
            // Mở trang Web tương ứng trong Iframe
            const iframe = document.getElementById('cloud-iframe');
            iframe.src = selectedCloud === 'vmos' ? 'https://cloud.vmoscloud.com/' : 'https://cloud.vsphone.com/?channel=web';

            // Yêu cầu Bot Discord tạo Mail mới
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: "REQUEST_NEW_MAIL", provider: selectedCloud }));
            }
        }

        function closeIframeModal() {
            document.getElementById('modal-iframe').classList.add('hidden');
            document.getElementById('cloud-iframe').src = '';
            document.getElementById('email-display').classList.add('hidden');
        }

        function postToIframe(message) {
            const iframe = document.getElementById('cloud-iframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(message, '*');
            }
        }

        // Lắng nghe Message từ Iframe (Token & UserID sau khi login)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === "LOGIN_SUCCESS") {
                const { token, userId } = event.data;
                document.getElementById('log-status').innerText = "Đăng nhập thành công! Đang tự động nhận Trial Free...";
                
                // Gửi Token về Backend/Bot để gọi API nhận máy
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        action: "CLAIM_FREE_TRIAL",
                        provider: selectedCloud,
                        token: token,
                        userId: userId
                    }));
                }
            }
        });
    </script>
</body>
</html>
