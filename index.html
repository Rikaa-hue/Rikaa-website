<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meows Cloud Manager</title>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #2563eb;
            --border-color: #1e293b;
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #0b1120;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: bold;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-bar {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #1e293b;
            background-color: #0d1527;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            border: none;
        }

        /* Grid chứa danh sách máy ảo */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .device-card {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 8px 12px;
            background-color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .screen-area {
            height: 420px;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Màn hình mô phỏng Android */
        .android-mockup {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #93c5fd;
            font-size: 0.9rem;
        }

        .add-card-btn {
            border: 2px dashed #334155;
            background: transparent;
            min-height: 460px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .add-card-btn:hover {
            border-color: var(--accent-blue);
            color: white;
        }

        /* Modal Đăng ký VMOS Cloud */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 360px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 12px 15px;
            background-color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 15px;
        }

        .vmos-iframe-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            color: #333;
        }

        .vmos-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .vmos-btn {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo"> Meows.vn Cloud Manager</div>
        <div style="font-size: 0.85rem;">Máy hiện có: <strong id="dev-count">0</strong></div>
    </header>

    <div class="control-bar">
        <button class="btn">Chọn tất cả</button>
        <button class="btn">Link Chia Sẻ</button>
        <button class="btn btn-primary">Batch Operation</button>
    </div>

    <main class="device-grid" id="grid-container">
        <!-- Nút nhận máy mới luôn nằm ở đây -->
        <div class="add-card-btn" id="btn-add-device" onclick="showSelectProviderModal()">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">+</div>
            <div>Nhận Máy Free</div>
        </div>
    </main>

    <!-- Modal 1: Chọn Nhà Cung Cấp -->
    <div id="modal-provider" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <strong>Nhận Máy Free</strong>
                <span style="cursor:pointer" onclick="closeModal('modal-provider')">&times;</span>
            </div>
            <div class="modal-body">
                <p style="font-size: 0.85rem; color: #94a3b8; margin-top:0;">Cloudphone: (Chọn 1)</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                    <button class="btn btn-primary" style="padding: 10px;">VMOS</button>
                    <button class="btn" style="padding: 10px;">UmoCloud</button>
                    <button class="btn" style="padding: 10px;">Vsphone</button>
                    <button class="btn" style="padding: 10px;">Tksales</button>
                </div>
                <button class="btn btn-primary" style="width: 100%; padding: 10px;" onclick="openVmosAuthModal()">Lấy máy</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Giao diện Đăng ký VMOS Cloud & Lấy OTP -->
    <div id="modal-vmos-auth" class="modal-overlay hidden">
        <div class="modal-box" style="width: 380px;">
            <div class="modal-header">
                <strong id="auth-title">UTA0v1.</strong>
                <span style="cursor:pointer" onclick="closeModal('modal-vmos-auth')">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Khung hiển thị Email Tạm & Trạng thái OTP -->
                <div style="background: #1e293b; padding: 8px; border-radius: 6px; font-size: 0.75rem; margin-bottom: 10px;">
                    <div>Email tạm đã tạo: <strong id="temp-email" style="color:#60a5fa;">...</strong></div>
                    <div style="color: #34d399; margin-top: 4px;" id="otp-status">Đang chờ mã xác minh (check mỗi 2.5s)...</div>
                </div>

                <!-- Cửa sổ Đăng ký VMOS -->
                <div class="vmos-iframe-container" id="vmos-form-box">
                    <div style="text-align: center; margin-bottom: 15px;">
                        <h2 style="color: #2563eb; margin: 0;">VMOS Cloud</h2>
                    </div>
                    <input type="text" id="vmos-email-input" class="vmos-input" readonly placeholder="Đang tự điền email...">
                    <button class="vmos-btn" onclick="submitVmosRegister()">Đăng nhập/Đăng ký</button>
                </div>

                <!-- Khung Nhập OTP (Tự điền khi tìm thấy) -->
                <div class="vmos-iframe-container hidden" id="vmos-otp-box" style="margin-top: 10px;">
                    <p style="margin: 0 0 8px 0; font-size: 0.85rem;">Mã xác minh (OTP):</p>
                    <input type="text" id="vmos-otp-input" class="vmos-input" placeholder="Mã 6 chữ số...">
                    <button class="vmos-btn" style="background-color: #16a34a;" onclick="finishRegisterAndCreateMachine()">Xác Nhận & Tạo Máy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let deviceCount = 0;

        function showSelectProviderModal() {
            document.getElementById('modal-provider').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // Tạo email ảo ngẫu nhiên kiểu @uberip.com
        function generateRandomEmail() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 10; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res + '@uberip.com';
        }

        function openVmosAuthModal() {
            closeModal('modal-provider');
            
            const email = generateRandomEmail();
            document.getElementById('temp-email').innerText = email;
            document.getElementById('vmos-email-input').value = email;
            
            document.getElementById('vmos-form-box').classList.remove('hidden');
            document.getElementById('vmos-otp-box').classList.add('hidden');
            document.getElementById('otp-status').innerText = "Đang chờ mã xác minh (check mỗi 2.5s)...";

            document.getElementById('modal-vmos-auth').classList.remove('hidden');
        }

        function submitVmosRegister() {
            // Giả lập gửi yêu cầu OTP từ VMOS
            document.getElementById('otp-status').innerText = "Đã gửi mã xác minh! Đang tự động bắt OTP...";
            
            // Giả lập nhận mã OTP tự động sau 2 giây
            setTimeout(() => {
                const randomOtp = Math.floor(100000 + Math.random() * 900000);
                document.getElementById('vmos-otp-input').value = randomOtp;
                document.getElementById('vmos-otp-box').classList.remove('hidden');
                document.getElementById('otp-status').innerText = "Mã xác minh: " + randomOtp + " (Đã tự nhận)";
            }, 2000);
        }

        // Sau khi bấm xác nhận, màn hình máy VMOS sẽ xuất hiện trên giao diện Web chính
        function finishRegisterAndCreateMachine() {
            closeModal('modal-vmos-auth');
            deviceCount++;
            
            document.getElementById('dev-count').innerText = deviceCount;

            // Tạo thẻ màn hình VMOS Android mới
            const grid = document.getElementById('grid-container');
            const addBtn = document.getElementById('btn-add-device');

            const card = document.createElement('div');
            card.className = 'device-card';
            card.innerHTML = `
                <div class="card-header">
                    <span><input type="checkbox"> System Gift #${deviceCount}</span>
                    <span style="color: #4ade80; font-size: 0.75rem;">Online</span>
                </div>
                <div class="screen-area">
                    <div class="android-mockup">
                        <div style="font-size: 2rem; margin-bottom: 10px;">📱</div>
                        <div>Màn hình VMOS Cloud #${deviceCount}</div>
                        <small style="color: #64748b; margin-top: 5px;">Thời gian: 4h 59m</small>
                    </div>
                </div>
            `;

            // Thêm máy mới vào trước nút "Nhận Máy Free"
            grid.insertBefore(card, addBtn);
        }
    </script>
</body>
</html>
