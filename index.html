<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meows.vn - Cloud Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Header */
        header {
            background: #111827;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #3b82f6;
        }

        /* Control Bar */
        .toolbar {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* Main Grid Area */
        .container {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            flex-grow: 1;
        }

        /* Card 'Nhận Máy Free' */
        .add-card {
            border: 2px dashed #374151;
            border-radius: 12px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #9ca3af;
            transition: 0.3s;
        }

        .add-card:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .add-card span {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        /* Card Máy Đã Nhận */
        .device-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #60a5fa;
        }

        .device-screen {
            background: #000;
            height: 320px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .device-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #1e293b;
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .close-btn {
            cursor: pointer;
            color: #9ca3af;
        }

        .cloud-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .cloud-opt {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .cloud-opt.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        /* Web Registration Panel */
        .reg-panel {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            max-width: 500px;
            height: 85vh;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            z-index: 101;
            flex-direction: column;
            overflow: hidden;
        }

        .reg-header {
            padding: 10px 15px;
            background: #0f172a;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mail-box {
            background: #0f172a;
            padding: 10px 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .status-box {
            padding: 10px;
            background: #0f172a;
            font-size: 0.85rem;
            color: #a7f3d0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Meows.vn</div>
        <div>👤 User Account</div>
    </header>

    <div class="toolbar">
        <button class="btn">Batch operation</button>
        <button class="btn" style="background: #0284c7;">Group Control</button>
    </div>

    <div class="container" id="deviceGrid">
        <div class="add-card" onclick="openModal()">
            <span>➕</span>
            <div>Nhận Máy Free</div>
        </div>
    </div>

    <!-- Modal Chọn Cloudphone -->
    <div class="modal-overlay" id="cloudModal">
        <div class="modal">
            <div class="modal-title">
                <span>Nhận Máy Free</span>
                <span class="close-btn" onclick="closeModal()">✕</span>
            </div>
            <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;">Cloudphone: (Chọn 1)</p>
            <div class="cloud-options">
                <div class="cloud-opt active" onclick="selectCloud(this, 'vmos')">Vmos</div>
                <div class="cloud-opt" onclick="selectCloud(this, 'umocloud')">UmoCloud</div>
                <div class="cloud-opt" onclick="selectCloud(this, 'vsphone')">Vsphone</div>
                <div class="cloud-opt" onclick="selectCloud(this, 'tiksales')">Tiksales</div>
            </div>
            <button class="btn" style="width: 100%;" onclick="startGetMachine()">Lấy máy</button>
        </div>
    </div>

    <!-- Panel Đăng Ký & Nhận Máy -->
    <div class="reg-panel" id="regPanel">
        <div class="reg-header">
            <span id="panelTitle">UTA0v1</span>
            <span class="close-btn" onclick="closeRegPanel()">✕</span>
        </div>
        <div class="mail-box">
            📧 Email tạm đã tạo: <b id="tempMailText">Đang tạo...</b><br>
            <small style="color: #9ca3af;">Email đã được sao chép - dán vào khung đăng ký bên dưới</small>
        </div>
        <div class="iframe-container">
            <iframe id="cloudIframe" src=""></iframe>
        </div>
        <div class="status-box" id="statusText">
            🔄 Đang chờ thao tác đăng ký từ người dùng...
        </div>
    </div>

    <script>
        let selectedCloud = 'vmos';
        const backendApi = 'http://localhost:3000/api'; // Đường dẫn đến API server của bé

        function openModal() {
            document.getElementById('cloudModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('cloudModal').style.display = 'none';
        }

        function selectCloud(el, type) {
            document.querySelectorAll('.cloud-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            selectedCloud = type;
        }

        async function startGetMachine() {
            closeModal();
            document.getElementById('regPanel').style.display = 'flex';
            
            // Lấy email tạm từ server
            const res = await fetch(`${backendApi}/gen-email`);
            const data = await res.json();
            document.getElementById('tempMailText').innerText = data.email;
            
            // Set URL trang đăng ký
            const targetUrl = selectedCloud === 'vmos' 
                ? 'https://cloud.vmoscloud.com/' 
                : 'https://cloud.vsphone.com/';
            
            document.getElementById('cloudIframe').src = targetUrl;
            startOtpPolling(data.email);
        }

        function closeRegPanel() {
            document.getElementById('regPanel').style.display = 'none';
        }

        // Tự động kiểm tra OTP từ Server
        function startOtpPolling(email) {
            const interval = setInterval(async () => {
                const res = await fetch(`${backendApi}/get-otp?email=${email}`);
                const data = await res.json();
                if(data.otp) {
                    document.getElementById('statusText').innerText = `✅ Đã nhận OTP: ${data.otp}. Đang tự động claim máy...`;
                    clearInterval(interval);
                    claimMachine(email, data.otp);
                }
            }, 3000);
        }

        async function claimMachine(email, otp) {
            const res = await fetch(`${backendApi}/claim-machine`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, otp, cloud: selectedCloud })
            });
            const result = await res.json();
            
            if(result.success) {
                document.getElementById('statusText').innerText = `🎉 Mua được máy thành công! PadID: ${result.padId}`;
                setTimeout(() => {
                    closeRegPanel();
                    addDeviceCard(result.machineName, result.shareUrl);
                }, 2000);
            }
        }

        function addDeviceCard(name, shareUrl) {
            const grid = document.getElementById('deviceGrid');
            const card = document.createElement('div');
            card.className = 'device-card';
            card.innerHTML = `
                <div class="device-header">
                    <span>📱 ${name}</span>
                    <small style="color: #22c55e;">Online</small>
                </div>
                <div class="device-screen">
                    <iframe src="${shareUrl || 'about:blank'}"></iframe>
                </div>
            `;
            grid.insertBefore(card, grid.firstChild);
        }
    </script>
</body>
</html>
