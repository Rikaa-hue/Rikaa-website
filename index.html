<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudphone Manager Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #2563eb;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #0d1322;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #60a5fa;
        }

        /* Control Bar */
        .control-bar {
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
        }

        /* Main Grid Grid Devices */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .device-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .screen-container {
            height: 480px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .screen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .provider-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .provider-btn {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .provider-btn.active {
            border-color: var(--accent-color);
            background: #1d4ed8;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">CloudManager.vn</div>
        <div><span>Máy hiện có: <strong id="device-count">1</strong></span></div>
    </header>

    <div class="control-bar">
        <button class="btn">Chọn tất cả</button>
        <button class="btn">Link Chia Sẻ</button>
        <button class="btn btn-primary">Batch Operation</button>
    </div>

    <main class="device-grid">
        <!-- Thẻ Máy ảo hiện tại -->
        <div class="device-card">
            <div class="card-header">
                <span><input type="checkbox"> System Gift</span>
                <span style="color: #4ade80;">Online</span>
            </div>
            <div class="screen-container">
                <!-- Vùng hiển thị màn hình Android (VNC / WebRTC / Scrcpy Web) -->
                <p style="color: #64748b;">[Màn hình Android Live Stream]</p>
            </div>
        </div>

        <!-- Nút Nhận Máy Mới -->
        <div class="device-card" style="border: 2px dashed #334155; justify-content: center; align-items: center; min-height: 520px; cursor: pointer;" onclick="toggleModal(true)">
            <div style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: 10px;">+</div>
                <div>Nhận Máy Free</div>
            </div>
        </div>
    </main>

    <!-- Modal chọn dịch vụ Cloudphone -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">Nhận Máy Free</h3>
                <span style="cursor: pointer;" onclick="toggleModal(false)">&times;</span>
            </div>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 5px;">Cloudphone: (Chọn 1)</p>
            
            <div class="provider-options">
                <div class="provider-btn active">Vmos</div>
                <div class="provider-btn">UmoCloud</div>
                <div class="provider-btn">Vsphone</div>
                <div class="provider-btn">Tksales</div>
            </div>

            <button class="btn btn-primary" style="width: 100%; padding: 10px;" onclick="claimDevice()">Lấy máy</button>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function claimDevice() {
            alert("Bắt đầu tiến trình tự động tạo tài khoản & lấy máy...");
            toggleModal(false);
        }
    </script>
</body>
</html>
