<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMOS Cloud Manager</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-color: #2563eb;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #0d1322;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-size: 1.3rem; font-weight: bold; color: #60a5fa; }

        .control-bar {
            padding: 15px 25px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--accent-color); border: none; }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 25px;
        }

        .device-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
        }

        /* Modal Khung Nhận Máy */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 12px 15px;
            background: #0d1322;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .iframe-container {
            width: 100%;
            height: 520px;
            background: #fff;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">VMOS Manager</div>
        <div>Số máy đang có: <strong id="count">0</strong></div>
    </header>

    <div class="control-bar">
        <button class="btn btn-primary" onclick="openClaimModal()">+ Nhận Máy Free (VMOS Cloud)</button>
    </div>

    <!-- Danh sách máy đã nhận -->
    <main class="device-grid" id="device-grid">
        <!-- Danh sách máy đã lưu sẽ tự hiện ở đây -->
    </main>

    <!-- Modal nhúng trang web VMOS Cloud để đăng nhập -->
    <div id="vmos-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <span>Đăng nhập VMOS Cloud</span>
                <button class="btn" style="padding: 2px 8px;" onclick="closeClaimModal()">X</button>
            </div>
            
            <div class="iframe-container">
                <!-- Nhúng trực tiếp trang đăng nhập VMOS Cloud -->
                <iframe id="vmos-frame" src="about:blank"></iframe>
            </div>

            <div style="padding: 12px; background: #0d1322; border-top: 1px solid var(--border-color); display: flex; gap: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="confirmAddMachine()">Đã nhận máy thành công</button>
            </div>
        </div>
    </div>

    <script>
        let machines = JSON.parse(localStorage.getItem('my_vmos_list')) || [];

        function renderList() {
            const grid = document.getElementById('device-grid');
            document.getElementById('count').innerText = machines.length;
            grid.innerHTML = '';

            if (machines.length === 0) {
                grid.innerHTML = '<p style="color: #64748b;">Chưa có máy nào. Bấm nút "Nhận Máy Free" để bắt đầu.</p>';
                return;
            }

            machines.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="card-header">
                        <strong>${item.name}</strong>
                        <span style="color: #4ade80; font-size: 0.8rem;">Online</span>
                    </div>
                    <div style="padding: 15px; font-size: 0.85rem;">
                        <p style="margin: 5px 0;"><strong>Thời gian tạo:</strong> ${item.time}</p>
                        <p style="margin: 5px 0;"><strong>Trạng thái:</strong> Đã kết nối</p>
                    </div>
                    <div style="padding: 10px; background: rgba(0,0,0,0.2); display: flex; gap: 8px;">
                        <button class="btn btn-primary" style="flex: 1;" onclick="openDevice()">Vào Điều Khiển</button>
                        <button class="btn" style="color: #ef4444;" onclick="deleteMachine(${index})">Xóa</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openClaimModal() {
            // Load trang VMOS Cloud vào iframe
            document.getElementById('vmos-frame').src = "https://www.vmos.cn/";
            document.getElementById('vmos-modal').classList.remove('hidden');
        }

        function closeClaimModal() {
            document.getElementById('vmos-frame').src = "about:blank";
            document.getElementById('vmos-modal').classList.add('hidden');
        }

        function confirmAddMachine() {
            // Lưu thông tin máy mới vào danh sách
            const newMachine = {
                name: "VMOS System Gift #" + (machines.length + 1),
                time: new Date().toLocaleString('vi-VN')
            };
            machines.push(newMachine);
            localStorage.setItem('my_vmos_list', JSON.stringify(machines));
            
            closeClaimModal();
            renderList();
        }

        function deleteMachine(index) {
            machines.splice(index, 1);
            localStorage.setItem('my_vmos_list', JSON.stringify(machines));
            renderList();
        }

        function openDevice() {
            alert("Mở giao diện điều khiển máy ảo!");
        }

        renderList();
    </script>
</body>
</html>
